# Apps der Shared-DEV-Umgebung.
#
# mount  <app-id>  <Pfad relativ zum Repo-Root>   – read-only Live-Mount aus einem Nachbarprojekt;
#                                                  fehlt der Pfad, wird die App übersprungen
# store  <app-id>                                 – aus dem App-Store installieren (occ app:install)
mount  nc_gantt        ../nc-gantt/nc_gantt
mount  nc_netherrack   ../Netherrack/nc_netherrack
mount  nc_ismscm       ../nc_ismscm/nc_ismscm
mount  nc_vertragswerk ../contractmanager/contractmanager
store  deck
store  calendar
store  spreed
store  groupfolders
