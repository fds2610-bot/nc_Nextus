; Dev-only: PHP-Änderungen am Live-Mount sofort wirksam, ohne opcache_reset.
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; Dev-only: Der Tracing-JIT von PHP 8.5 übersetzte in nc_gantt Schleifen ab ~60 Durchläufen
; falsch (Endlosschleife, 25.09.2026). In der DEV-Umgebung daher aus.
opcache.jit=off
