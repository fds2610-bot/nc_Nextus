# Dev-only: liefert die per Live-Mount außerhalb des DocumentRoot liegende
# Apps aus und unterbindet Browser-Caching der gebauten Assets,
# damit ein einfaches F5 (statt Strg+Shift+R) genügt.
Alias /custom_apps /custom_apps

<Directory /custom_apps>
    Require all granted
    Options -Indexes
</Directory>

<LocationMatch "^/custom_apps/[^/]+/(js|css)/">
    Header set Cache-Control "no-store, must-revalidate"
</LocationMatch>
